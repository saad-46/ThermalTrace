name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_USER: tt, POSTGRES_PASSWORD: tt, POSTGRES_DB: tt_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tt" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r requirements.txt pip-audit
      - run: ruff check app tests
      - name: tests (unit + PostGIS integration + ML)
        env: { TEST_DATABASE_URL: "postgresql+psycopg://tt:tt@localhost:5432/tt_test" }
        run: pytest -p no:warnings
      - name: dependency vulnerability scan (report only)
        run: pip-audit -r requirements.txt --progress-spinner off || true

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high || true

  images:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t thermaltrace-api backend && docker build -t thermaltrace-web frontend
